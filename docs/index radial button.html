<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários Corrigido</title>
</head>
<body>
    <h1>Formulários</h1>
    <p>Aula sobre formulários em HTML</p>
    
    
    <form id="meuForm">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        <br/><br/>
        <label for="senha">Senha:</label>
        
        <input type="password" id="senha" name="senha" placeholder="Digite sua Senha" required>
        <br/>
        <br/>
        <label for="radio">Qual sua cor favorita?</label>
        <br/>
        </form>
        <input type="radio" id="button" name="fav-color" value="Vermelho">
        <label for="html">Vermelho</label><br>
        <input type="radio" id="button" name="fav-color" value="Preto">
        <label for="html">Preto</label><br> 
        <input type="radio" id="button" name="fav-color" value="Verde">
        <label for="html">Verde</label><br>
        <input type="radio" id="button" name="fav-color" value="Azul">
        <label for="html">Azul</label><br>
        <input type="radio" id="button" name="fav-color" value="Branco">
        <label for="html">Branco</label><br>
        <br/><br/>
        <input id="enviar" type="submit" value="Enviar">
    </form>

    <script type="application/javascript">
        function dizer_ola(event) {
            event.preventDefault(); 
            let nome = document.getElementById('nome').value;
            let senha = document.getElementById('senha').value;
            
            alert('Seja Bem vindo, ' + nome + '!');
            alert('Sua Senha é: ' + senha); 
        }
        
        
        document.getElementById('meuForm').addEventListener('submit', dizer_ola);
    </script>
</body>
</html>
